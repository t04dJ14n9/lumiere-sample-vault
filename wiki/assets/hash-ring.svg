<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Consistent hashing ring with four nodes A to D and six keys">
<title>Consistent hashing ring with four nodes A to D and six keys</title>
<rect x="0.5" y="0.5" width="639" height="379" rx="14" fill="#f7f9fb" stroke="#cbd2d9"/>
<circle cx="190" cy="190" r="120" fill="none" stroke="#cbd2d9" stroke-width="10"/>
<text x="190" y="186" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">hash ring</text>
<text x="190" y="206" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#616e7c" text-anchor="middle" font-weight="normal">0 to 2^32</text>
<circle cx="231.0" cy="77.2" r="17" fill="#2f6fdb" stroke="#ffffff" stroke-width="3"/>
<text x="231.0" y="82.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<circle cx="305.9" cy="221.1" r="17" fill="#2f6fdb" stroke="#ffffff" stroke-width="3"/>
<text x="305.9" y="226.1" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
<circle cx="149.0" cy="302.8" r="17" fill="#2f6fdb" stroke="#ffffff" stroke-width="3"/>
<text x="149.0" y="307.8" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">C</text>
<circle cx="77.2" cy="149.0" r="17" fill="#2f6fdb" stroke="#ffffff" stroke-width="3"/>
<text x="77.2" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">D</text>
<circle cx="281.9" cy="112.9" r="6" fill="#e07a1f" stroke="#ffffff" stroke-width="2"/>
<text x="304.9" y="97.6" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#616e7c" text-anchor="middle" font-weight="normal">k1</text>
<circle cx="308.2" cy="169.2" r="6" fill="#e07a1f" stroke="#ffffff" stroke-width="2"/>
<text x="337.7" y="168.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#616e7c" text-anchor="middle" font-weight="normal">k2</text>
<circle cx="267.1" cy="281.9" r="6" fill="#e07a1f" stroke="#ffffff" stroke-width="2"/>
<text x="286.4" y="308.9" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#616e7c" text-anchor="middle" font-weight="normal">k3</text>
<circle cx="200.5" cy="309.5" r="6" fill="#e07a1f" stroke="#ffffff" stroke-width="2"/>
<text x="203.1" y="343.4" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#616e7c" text-anchor="middle" font-weight="normal">k4</text>
<circle cx="91.7" cy="258.8" r="6" fill="#e07a1f" stroke="#ffffff" stroke-width="2"/>
<text x="67.1" y="280.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#616e7c" text-anchor="middle" font-weight="normal">k5</text>
<circle cx="130.0" cy="86.1" r="6" fill="#e07a1f" stroke="#ffffff" stroke-width="2"/>
<text x="115.0" y="64.1" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#616e7c" text-anchor="middle" font-weight="normal">k6</text>
<text x="400" y="90" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">Each key belongs to the first node</text>
<text x="400" y="110" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">met going clockwise from it.</text>
<text x="400" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#616e7c" text-anchor="start" font-weight="normal">Adding node E takes keys from</text>
<text x="400" y="170" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#616e7c" text-anchor="start" font-weight="normal">one neighbour only, about K / N</text>
<text x="400" y="190" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#616e7c" text-anchor="start" font-weight="normal">of all K keys.</text>
<circle cx="408" cy="236" r="6" fill="#2f6fdb"/>
<text x="422" y="241" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#616e7c" text-anchor="start" font-weight="normal">node</text>
<circle cx="478" cy="236" r="6" fill="#e07a1f"/>
<text x="492" y="241" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#616e7c" text-anchor="start" font-weight="normal">key</text>
</svg>
