<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" width="640" height="268" role="img" aria-label="Quorum overlap: five replicas with a write quorum and a read quorum sharing one replica">
<title>Quorum overlap: five replicas with a write quorum and a read quorum sharing one replica</title>
<rect x="0.5" y="0.5" width="639" height="267" rx="14" fill="#f7f9fb" stroke="#cbd2d9"/>
<text x="320" y="36" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">N = 5 replicas, W = 3, R = 3</text>
<circle cx="80" cy="130" r="34" fill="#2f6fdb" fill-opacity="0.9" stroke="#1f2933" stroke-width="1.5"/>
<text x="80" y="136" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">R1</text>
<circle cx="200" cy="130" r="34" fill="#2f6fdb" fill-opacity="0.9" stroke="#1f2933" stroke-width="1.5"/>
<text x="200" y="136" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">R2</text>
<circle cx="320" cy="130" r="34" fill="#2f9e6f" fill-opacity="0.9" stroke="#1f2933" stroke-width="1.5"/>
<text x="320" y="136" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">R3</text>
<circle cx="440" cy="130" r="34" fill="#e07a1f" fill-opacity="0.9" stroke="#1f2933" stroke-width="1.5"/>
<text x="440" y="136" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">R4</text>
<circle cx="560" cy="130" r="34" fill="#e07a1f" fill-opacity="0.9" stroke="#1f2933" stroke-width="1.5"/>
<text x="560" y="136" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">R5</text>
<path d="M 46 184 H 354" stroke="#2f6fdb" stroke-width="4" stroke-linecap="round"/>
<text x="200" y="208" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6fdb" text-anchor="middle" font-weight="bold">write quorum (acknowledged by 3)</text>
<path d="M 286 196 H 594" stroke="#e07a1f" stroke-width="4" stroke-linecap="round"/>
<text x="440" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#e07a1f" text-anchor="middle" font-weight="bold">read quorum (answered by 3)</text>
<text x="320" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#616e7c" text-anchor="middle" font-weight="normal">R3 is in both sets, so every read sees the latest write.</text>
</svg>
